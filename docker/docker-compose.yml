services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${PORT:-8000}:8000"
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/database/chroma
      METADATA_DATABASE_URL: sqlite:////app/database/metadata/app.db
      UPLOAD_DIRECTORY: /app/database/uploads
    volumes:
      - ../database:/app/database
      - ../models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
